name: Offline credential interoperability
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Same policy as Foundation CI, scoped per workflow so the two workflows
# never cancel each other; main commits are never auto-cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  node-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -S firmware-esp32/tests -B build/offline-auth -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/offline-auth --parallel
      - run: ctest --test-dir build/offline-auth --output-on-failure
