name: ESP32-C3 board build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  esp32c3:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    strategy:
      matrix:
        variant: [production, dev, field-alpha]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Persistent compiler cache (#144): the pinned IDF container already
      # ships ccache and export.sh enables it (IDF_CCACHE_ENABLE=1), but the
      # default CCACHE_DIR is ephemeral, so every CI run recompiles cold.
      # Persist only ccache outputs under a workspace-relative directory
      # (visible on the host for actions/cache and inside the container via
      # GITHUB_WORKSPACE). Never persist whole build-ci-* directories: fresh
      # checkouts re-run CMake configuration from scratch.
      # Safety: keys are per-variant (production/dev never share objects);
      # the key hashes the workflow file (pinned container digest), target
      # configuration inputs and a schema version, so container/toolchain or
      # config changes miss instead of reusing incompatible objects. ccache
      # additionally hashes compiler flags per object. Restore keys stay
      # within the same variant prefix. Bound: 1 GiB per variant.
      # Correctness note: ccache hashes the compiler and the file given via
      # the IDF-injected `-specs=<build>/specs/picolibc.specs` flag by
      # size+mtime by default, but ESP-IDF regenerates that specs file on
      # every fresh configure (fresh CI checkout) with identical content and
      # a new mtime, so mtime-based checks would never hit across runs.
      # CCACHE_COMPILERCHECK=content hashes file contents instead, which is
      # exact for both the compiler and the specs file and stays correct on
      # toolchain upgrades (different content misses and rebuilds).
      - name: Restore ccache compiler cache
        # Optional: a restore failure must never break the build; the job
        # below always performs a correct full build on a cache miss.
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache-esp32c3-${{ matrix.variant }}
          key: esp32c3-ccache-v1-${{ matrix.variant }}-${{ hashFiles('.github/workflows/esp32.yml', 'firmware-esp32/idf/sdkconfig.defaults', 'firmware-esp32/idf/sdkconfig.dev', 'firmware-esp32/idf/sdkconfig.field-alpha', 'firmware-esp32/idf/CMakeLists.txt', 'firmware-esp32/idf/dependencies.lock', 'firmware-esp32/idf/partitions.csv') }}
          restore-keys: |
            esp32c3-ccache-v1-${{ matrix.variant }}-
      - name: Build and check image/partition sizes (no hardware)
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          IDF_CCACHE_ENABLE: 1
          CCACHE_DIR: ${{ github.workspace }}/.ccache-esp32c3-${{ matrix.variant }}
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPILERCHECK: content
        run: |
          . /opt/esp/idf/export.sh > /dev/null
          echo "ccache version: $(ccache --version 2>&1 | head -n 1 || true)"
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=1G > /dev/null || true
          ccache --zero-stats || true
          ccache --show-stats || true
          python -m unittest discover -s firmware-esp32/tools -p 'test_*.py'
          defaults=sdkconfig.defaults
          development=OFF
          if [ "$VARIANT" = dev ]; then defaults="$defaults;sdkconfig.dev"; development=ON; fi
          if [ "$VARIANT" = field-alpha ]; then defaults="$defaults;sdkconfig.field-alpha"; fi
          idf.py -C firmware-esp32/idf -B "$GITHUB_WORKSPACE/firmware-esp32/idf/build-ci-$VARIANT" \
            -D "SDKCONFIG=sdkconfig.local-ci-$VARIANT" \
            -D "SDKCONFIG_DEFAULTS=$defaults" -D "MM_DEVELOPMENT_BUILD=$development" build size
          python - "$VARIANT" <<'PY'
          import json, pathlib, subprocess, sys
          variant = sys.argv[1]
          config = json.loads(pathlib.Path(f'firmware-esp32/idf/build-ci-{variant}/config/sdkconfig.json').read_text())
          assert config['IDF_TARGET'] == 'esp32c3'
          assert bool(config.get('MM_FIELD_ALPHA_PHONE_CLOCK')) == (variant == 'field-alpha')
          assert bool(config.get('MM_DEV_SYNTHETIC_INPUT')) == (variant == 'dev')
          assert bool(config.get('MM_DEV_GPIO_RFID')) == (variant == 'dev')
          elf = f'firmware-esp32/idf/build-ci-{variant}/miezmerker-node.elf'
          symbols = subprocess.check_output(['riscv32-esp-elf-nm', '-C', elf], text=True)
          assert ('DevButtonReader::poll' in symbols) == (variant == 'dev')
          if variant == 'dev':
              result = subprocess.run(['idf.py', '-C', 'firmware-esp32/idf',
                  '-B', str(pathlib.Path('firmware-esp32/idf/build-ci-release-reject').resolve()),
                  '-D', 'SDKCONFIG=sdkconfig.local-ci-release-reject',
                  '-D', 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.dev',
                  '-D', 'MM_DEVELOPMENT_BUILD=OFF', 'reconfigure'],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              pathlib.Path('firmware-esp32/idf/build-ci-release-reject/release-guard.log').write_text(result.stdout)
              assert result.returncode != 0 and 'Development inputs forbidden in release' in result.stdout
              print('PASS release profile rejects development sdkconfig')
          PY
          echo "--- ccache statistics ($VARIANT) ---"
          ccache --show-stats || true
          echo "cache directory size:"
          du -sh "$CCACHE_DIR" || true
      - name: Show ccache statistics on failure
        if: failure()
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache-esp32c3-${{ matrix.variant }}
        run: |
          . /opt/esp/idf/export.sh > /dev/null
          ccache --show-stats || true
          du -sh "$CCACHE_DIR" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: esp32c3-${{ matrix.variant }}
          path: |
            firmware-esp32/idf/build-ci-${{ matrix.variant }}/miezmerker-node.bin
            firmware-esp32/idf/build-ci-${{ matrix.variant }}/miezmerker-node.elf
            firmware-esp32/idf/build-ci-${{ matrix.variant }}/bootloader/bootloader.bin
            firmware-esp32/idf/build-ci-${{ matrix.variant }}/partition_table/partition-table.bin
            firmware-esp32/idf/build-ci-${{ matrix.variant }}/flash_args
            firmware-esp32/idf/build-ci-${{ matrix.variant }}/flasher_args.json
