<title id="title">MiezMerker – bestätigter UX-Wireframe, Runde 2</title>
<desc id="desc">Vier vereinfachte Handyansichten: kontextfreie Home mit Auslesen-Button, Bluetooth-Suche, Erfolg mit Napf und zuletzt gesehenen Katzen sowie Futterstellendetail; alle mit Bottom Navigation. Dies ist eine schematische Rekonstruktion.</desc>
