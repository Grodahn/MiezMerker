services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: miezmerker
      POSTGRES_USER: miezmerker
      POSTGRES_PASSWORD: miezmerker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miezmerker"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
