<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head th:fragment="head(title)">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title th:text="${title} + ' · MiezMerker Admin'">MiezMerker Admin</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.5;background:#f6f6f4;color:#1a1a1a}
header.topbar{background:#1f2937;color:#fff;padding:.75rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between}
header.topbar .org{font-weight:700}
header.topbar .user{opacity:.9;font-size:.9rem}
header.topbar form{margin:0}
nav.mainnav{background:#fff;border-bottom:1px solid #e5e7eb;padding:.5rem 1rem;display:flex;flex-wrap:wrap;gap:.25rem .75rem;align-items:center}
nav.mainnav a{padding:.4rem .6rem;border-radius:.4rem;text-decoration:none;color:#1f2937}
nav.mainnav a:hover,nav.mainnav a.active{background:#eef2ff}
nav.mainnav .orgswitch{margin-left:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
main{max-width:960px;margin:0 auto;padding:1rem}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:.6rem;padding:1rem;margin:.75rem 0}
.btn{background:#1f2937;color:#fff;border:0;border-radius:.4rem;padding:.5rem .9rem;cursor:pointer}
.btn-secondary{background:#e5e7eb;color:#111}
input,select{padding:.5rem;border:1px solid #d1d5db;border-radius:.4rem;max-width:100%}
label{display:block;margin:.5rem 0 .25rem;font-weight:600}
.alert{padding:.6rem .8rem;border-radius:.4rem;margin:.6rem 0}
.alert-error{background:#fee2e2;border:1px solid #fecaca}
.alert-info{background:#dbeafe;border:1px solid #bfdbfe}
.grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
a.cardlink{text-decoration:none;color:inherit}
.sr-only{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media(max-width:600px){header.topbar{flex-direction:column;align-items:flex-start}nav.mainnav .orgswitch{margin-left:0}}
</style>
</head>
<body>
<header class="topbar" th:fragment="topbar">
<div>
<div class="org" th:text="${activeOrg != null ? activeOrg.displayName : 'MiezMerker Admin'}">MiezMerker Admin</div>
<div class="user" th:if="${userLabel != null}">
<span th:text="${userLabel}">Admin</span>
<span th:if="${userEmail != null}" th:text="' · ' + ${userEmail}"> · mail</span>
</div>
</div>
<form th:if="${userLabel != null}" th:action="@{/admin/logout}" method="post">
<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
<button class="btn" type="submit">Abmelden</button>
</form>
</header>
<nav class="mainnav" th:fragment="nav(active)">
<a th:href="@{/admin/}" th:classappend="${active == 'dashboard'} ? ' active' : ''">Übersicht</a>
<a th:href="@{/admin/members}" th:classappend="${active == 'members'} ? ' active' : ''">Mitglieder</a>
<a th:href="@{/admin/sites}" th:classappend="${active == 'sites'} ? ' active' : ''">Futterstellen</a>
<a th:href="@{/admin/cats}" th:classappend="${active == 'cats'} ? ' active' : ''">Katzen</a>
<a th:href="@{/admin/observations}" th:classappend="${active == 'observations'} ? ' active' : ''">Rohbeobachtungen</a>
<a th:href="@{/admin/visits}" th:classappend="${active == 'visits'} ? ' active' : ''">Besuche</a>
<span class="orgswitch" th:if="${adminOrgs != null and #lists.size(adminOrgs) > 1}">
<form th:action="@{/admin/org}" method="post" style="display:flex;gap:.5rem;align-items:center">
<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
<label class="sr-only" for="nav-org">Organisation</label>
<select id="nav-org" name="organizationId">
<option th:each="o : ${adminOrgs}" th:value="${o.id}" th:text="${o.displayName}" th:selected="${activeOrg != null and o.id == activeOrg.id}">Org</option>
</select>
<button class="btn btn-secondary" type="submit">Wechseln</button>
</form>
<a th:href="@{/admin/org}">Auswahl</a>
</span>
</nav>
<footer th:fragment="footer" style="max-width:960px;margin:0 auto;padding:1rem;opacity:.7;font-size:.85rem">
<p>MiezMerker Admin-Backend · serverseitig · ADMIN-only · Mandantentrennung serverseitig erzwungen.</p>
</footer>
</body>
</html>
