spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/miezmerker}
    username: ${DB_USER:miezmerker}
    password: ${DB_PASSWORD:miezmerker}
    hikari:
      # V1 reserves a schema named after the PostgreSQL user. Pin every new
      # connection so that creating it cannot change migration/query lookup.
      connection-init-sql: SET search_path TO public
  servlet:
    multipart:
      # Container guard above the application limit (miezmerker.media.*):
      # uploads between the two are rejected by the app with a controlled
      # 413 instead of a container error. See docs/cat-photos.md.
      max-file-size: ${MEDIA_MULTIPART_MAX_FILE_SIZE:6MB}
      max-request-size: ${MEDIA_MULTIPART_MAX_REQUEST_SIZE:10MB}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:true}
        name: JSESSIONID
springdoc:
  api-docs:
    path: /api/v1/openapi
  paths-to-match: /api/v1/**
miezmerker:
  # Never enabled in production. The controller requires the explicit 'dev'
  # Spring profile as well as an opt-in flag; the file path is operator-supplied.
  dev-ca:
    enabled: ${MIEZMERKER_DEV_CA_ENABLED:false}
    public-cert-path: ${MIEZMERKER_DEV_CA_PUBLIC_CERT_PATH:}
  security:
    # BCrypt cost for password hashing. Default 12; only the "test" profile
    # lowers it (application-test.yaml). Uncomment to override explicitly.
    # bcrypt-strength: 12
  visits:
    # Default gap for visit-gap-v1 in seconds. Explicit hypothesis, not a hard
    # business rule; every recompute may override it per request and the used
    # value is stored on each DerivedVisit for auditability.
    default-gap-seconds: ${VISITS_DEFAULT_GAP_SECONDS:60}
  credential:
    ttl-hours: ${CREDENTIAL_TTL_HOURS:168}
  time-bootstrap:
    # Operator/monitor attestation, NOT an inferred NTP-health signal. See docs/node-time-bootstrap.md.
    clock-healthy: ${TIME_BOOTSTRAP_CLOCK_HEALTHY:false}
  issuer:
    private-key-pkcs8-b64: ${ISSUER_PRIVATE_PKCS8_B64:}
    public-key-spki-b64: ${ISSUER_PUBLIC_SPKI_B64:}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:}
    org-slug: ${BOOTSTRAP_ORG_SLUG:versuch}
    org-name: ${BOOTSTRAP_ORG_NAME:Versuchsorganisation}
    org-contact: ${BOOTSTRAP_ORG_CONTACT:}
  media:
    # Self-hosted cat photo storage (#95): plain filesystem directory holding
    # random, non-guessable JPEG files. Must live on persistent storage and be
    # included in backups together with the database (see docs/cat-photos.md).
    storage-dir: ${MEDIA_STORAGE_DIR:data/cat-photos}
    # Upload and image guards. Uploads above max-upload-bytes are rejected
    # with 413/400; decoded images above max-dimension per side or max-pixels
    # in total are rejected as malformed (decompression-bomb protection).
    max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:5242880}
    max-dimension: ${MEDIA_MAX_DIMENSION:4096}
    max-pixels: ${MEDIA_MAX_PIXELS:12000000}
    # Normalization for mobile devices: the long edge is scaled down to
    # target-long-edge and everything is re-encoded as JPEG (metadata-free)
    # with the configured quality.
    target-long-edge: ${MEDIA_TARGET_LONG_EDGE:1600}
    jpeg-quality: ${MEDIA_JPEG_QUALITY:0.85}
