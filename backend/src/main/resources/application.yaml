spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/miezmerker}
    username: ${DB_USER:miezmerker}
    password: ${DB_PASSWORD:miezmerker}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
springdoc:
  api-docs:
    path: /api/v1/openapi
  paths-to-match: /api/v1/health,/api/v1/version
