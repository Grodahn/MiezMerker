spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:h2:mem:miezmerker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${TEST_DB_USER:sa}
    password: ${TEST_DB_PASSWORD:}
    hikari:
      # Many distinct cached Spring test contexts share the CI PostgreSQL server.
      # Do not eagerly keep ten idle connections per context. The maximum pool
      # size and concurrency coverage stay unchanged; fixture connections remain
      # independent of the application pool.
      minimum-idle: 0
server:
  servlet:
    session:
      cookie:
        secure: false
miezmerker:
  # Reuse the shared test context/pool for positive diagnostic assertions.
  # A per-class SpringBootTest property would allocate another cached DB pool.
  claim-diagnostics:
    detailed: true
  security:
    # Test-only BCrypt cost (#59): real BCrypt hashing/matching semantics at a
    # fraction of the production cost (12). Active only via the "test" profile;
    # production defaults keep cost 12 (see BoundaryConfiguration).
    bcrypt-strength: 4
